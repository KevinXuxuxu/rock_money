<!DOCTYPE html>
<html lang="en">
<head>
  <title>Connect Your Bank — Finance Tracker</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 100vh; margin: 0;
      background: #f5f5f7; color: #1d1d1f;
    }
    .card {
      background: white; border-radius: 16px; padding: 48px 40px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08); max-width: 420px; width: 100%;
      text-align: center;
    }
    h1 { font-size: 24px; font-weight: 600; margin: 0 0 8px; }
    p  { color: #6e6e73; font-size: 15px; margin: 0 0 32px; line-height: 1.5; }
    button {
      background: #0071e3; color: white; border: none;
      border-radius: 980px; padding: 14px 28px; font-size: 16px;
      font-weight: 500; cursor: pointer; width: 100%;
    }
    button:hover { background: #0077ed; }
    button:disabled { background: #999; cursor: default; }
    #status {
      margin-top: 20px; font-size: 14px; color: #6e6e73; min-height: 20px;
    }
    .success { color: #1a8a3c; font-weight: 500; }
    .error   { color: #d93025; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Connect Your Bank</h1>
    <p>Link your bank accounts to start tracking transactions automatically.</p>
    <button id="link-btn" onclick="openLink()">Connect Account</button>
    <div id="status"></div>
  </div>

  <script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
  <script>
    let linkToken = null;

    async function init() {
      const res = await fetch('/api/link-token');
      const data = await res.json();
      if (data.error) {
        document.getElementById('status').className = 'error';
        document.getElementById('status').textContent = 'Error: ' + data.error;
        document.getElementById('link-btn').disabled = true;
        return;
      }
      linkToken = data.link_token;
    }

    function createHandler(extraConfig) {
      return Plaid.create({
        token: linkToken,
        ...extraConfig,
        onSuccess: async (public_token, metadata) => {
          document.getElementById('status').textContent = 'Saving account…';
          document.getElementById('link-btn').disabled = true;
          const res = await fetch('/api/exchange', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ public_token, metadata }),
          });
          const data = await res.json();
          if (data.ok) {
            document.getElementById('status').className = 'success';
            document.getElementById('status').textContent =
              `Connected: ${data.institution_name || 'Account linked'}. You can close this window.`;
          } else {
            document.getElementById('status').className = 'error';
            document.getElementById('status').textContent = 'Error: ' + data.error;
            document.getElementById('link-btn').disabled = false;
          }
        },
        onExit: (err, metadata) => {
          console.log('Link onExit', {err, metadata});
          if (err) {
            document.getElementById('status').className = 'error';
            document.getElementById('status').textContent =
              err.error_code + ': ' + (err.display_message || err.error_message || 'Link exited.');
          } else {
            document.getElementById('status').textContent =
              'Link closed (no error). metadata: ' + JSON.stringify(metadata || {});
          }
        },
      });
    }

    async function openLink() {
      if (!linkToken) {
        document.getElementById('status').textContent = 'Initializing…';
        await init();
      }
      if (!linkToken) return;
      createHandler({}).open();
    }

    // Handle OAuth redirect return (production OAuth institutions like Chase)
    async function handleOAuthReturn() {
      await init();
      if (!linkToken) return;
      // Store token for use after redirect, then re-init with receivedRedirectUri
      createHandler({ receivedRedirectUri: window.location.href }).open();
    }

    const params = new URLSearchParams(window.location.search);
    if (params.get('oauth_state_id')) {
      handleOAuthReturn();
    } else {
      init();
    }
  </script>
</body>
</html>
