<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} — rock money</title>
  <style>
    :root {
      --bg: #f5f5f7; --card: #fff; --text: #1d1d1f; --muted: #6e6e73;
      --border: #e5e5ea; --blue: #0071e3; --green: #1a8a3c;
      --red: #c0392b; --amber: #b45309;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { overflow-x: clip; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
           background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; }
    a { color: inherit; text-decoration: none; }

    /* ── Nav ───────────────────────────────────────────────── */
    nav { background: var(--card); border-bottom: 1px solid var(--border);
          height: 52px; display: flex; align-items: center; padding: 0 20px;
          position: relative; z-index: 200; }
    .brand { font-weight: 700; font-size: 15px; margin-right: 20px; flex-shrink: 0; }
    .nav-toggle { display: none; background: none; border: none; cursor: pointer;
                  font-size: 22px; line-height: 1; padding: 6px 8px; color: var(--text);
                  margin-left: auto; flex-shrink: 0; }
    .nav-links { display: flex; align-items: center; }
    .nav-link { color: var(--muted); padding: 16px 12px; font-size: 14px;
                border-bottom: 2px solid transparent; margin-bottom: -1px;
                display: inline-block; white-space: nowrap; flex-shrink: 0; }
    .nav-link:hover { color: var(--text); }
    .nav-link.active { color: var(--text); border-bottom-color: var(--blue); font-weight: 500; }

    /* ── Flash messages ────────────────────────────────────── */
    .flashes { max-width: 1120px; margin: 16px auto 0; padding: 0 20px; }
    .flash { padding: 11px 16px; border-radius: 8px; margin-bottom: 8px; font-size: 14px; }
    .flash-success { background: #d1fae5; color: #065f46; }
    .flash-info    { background: #dbeafe; color: #1e40af; }
    .flash-error   { background: #fee2e2; color: #991b1b; }

    /* ── Layout ────────────────────────────────────────────── */
    main { max-width: 1120px; margin: 0 auto; padding: 28px 20px; }
    h2 { font-size: 22px; font-weight: 600; margin: 0 0 20px; }
    h3 { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase;
         letter-spacing: .07em; margin: 0 0 14px; }
    section { margin-bottom: 32px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .row > *, .cards > * { min-width: 0; }

    /* ── Cards ─────────────────────────────────────────────── */
    .card { background: var(--card); border-radius: 12px; padding: 20px;
            box-shadow: 0 1px 3px rgba(0,0,0,.07), 0 0 0 1px var(--border); }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
    .stat-val { font-size: 26px; font-weight: 600; margin: 6px 0 2px; font-variant-numeric: tabular-nums; }
    .stat-label { font-size: 12px; color: var(--muted); }

    /* ── Tables ────────────────────────────────────────────── */
    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; min-width: 500px; }
    th { padding: 9px 12px; text-align: left; font-size: 11px; font-weight: 600;
         color: var(--muted); text-transform: uppercase; letter-spacing: .06em;
         border-bottom: 1px solid var(--border); white-space: nowrap; }
    td { padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 14px;
         white-space: nowrap; }
    tr:last-child td { border-bottom: none; }
    /* Merchant column: cap width and ellipsis-truncate long names (full text in title). */
    td.merchant { max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
    td.merchant a { display: inline-block; max-width: 100%; overflow: hidden;
                    text-overflow: ellipsis; white-space: nowrap; vertical-align: bottom; }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
    th.num { text-align: right; }
    .debit  { color: var(--red); }
    .credit { color: var(--green); }
    .muted  { color: var(--muted); }
    .mono   { font-family: ui-monospace, monospace; font-size: 12px; color: var(--muted); }

    /* ── Bar chart ─────────────────────────────────────────── */
    .bar-chart { display: flex; flex-direction: column; gap: 10px; }
    .bar-row { display: flex; align-items: center; gap: 8px; }
    .bar-label { width: 180px; flex-shrink: 0; font-size: 13px;
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar-track { flex: 1; background: var(--bg); border-radius: 4px; height: 16px; min-width: 40px; }
    .bar-fill  { height: 100%; background: var(--blue); border-radius: 4px; min-width: 2px; }
    .bar-amount { width: 80px; text-align: right; font-size: 13px; color: var(--muted);
                  font-variant-numeric: tabular-nums; flex-shrink: 0; }

    /* ── Filters form ──────────────────────────────────────── */
    .filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 20px; }
    .filters label { display: flex; flex-direction: column; gap: 4px;
                     font-size: 12px; color: var(--muted); font-weight: 500; }
    .filters input, .filters select { border: 1px solid var(--border); border-radius: 8px;
                                       padding: 7px 10px; font-size: 14px; background: white;
                                       color: var(--text); min-width: 110px; }
    .filters button { background: var(--blue); color: white; border: none;
                      border-radius: 8px; padding: 8px 16px; font-size: 14px;
                      font-weight: 500; cursor: pointer; white-space: nowrap; }
    .filters button:hover { background: #0077ed; }
    .btn-reset { background: transparent !important; color: var(--muted) !important;
                 border: 1px solid var(--border) !important; }
    .btn-secondary { background: var(--card) !important; color: var(--blue) !important;
                     border: 1px solid var(--blue) !important; }
    /* Inline checkbox+label row inside a filters form */
    .check-label { flex-direction: row !important; align-items: center !important;
                   gap: 6px !important; padding-bottom: 4px; }
    .check-label input[type="checkbox"] { min-width: 0; width: auto; padding: 0; }
    /* Compact bottom row (Limit + checkbox + buttons grouped together) */
    .filter-actions { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; }

    /* ── Budget status ─────────────────────────────────────── */
    .pct-cell { display: flex; align-items: center; gap: 8px; }
    .mini-bar  { display: inline-block; height: 6px; border-radius: 3px; }
    .on-track    { color: var(--green); }
    .near-budget { color: var(--amber); }
    .over-budget { color: var(--red); font-weight: 600; }

    /* ── Tags & chips ──────────────────────────────────────── */
    .tag-chip { display: inline-flex; align-items: center; gap: 4px; background: var(--bg);
                border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px;
                font-size: 12px; color: var(--text); cursor: pointer; margin: 2px; }
    .tag-chip:hover { background: #e5e5ea; }
    .chip { display: inline-block; background: var(--bg); border: 1px solid var(--border);
            border-radius: 999px; padding: 4px 12px; font-size: 13px; color: var(--text);
            margin-right: 6px; margin-bottom: 6px; }
    .chip:hover { background: #e5e5ea; }

    /* ── Month navigation ──────────────────────────────────── */
    .month-nav { display: flex; align-items: center; justify-content: center;
                 gap: 18px; margin-bottom: 22px; }
    .month-current { font-size: 18px; font-weight: 600; min-width: 150px; text-align: center; }
    .month-arrow { display: inline-flex; align-items: center; justify-content: center;
                   width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--border);
                   background: var(--card); color: var(--text); font-size: 22px; line-height: 1;
                   text-decoration: none; cursor: pointer; user-select: none; }
    .month-arrow:hover { background: var(--bg); }
    .month-arrow.disabled { color: var(--border); cursor: default;
                            pointer-events: none; background: var(--bg); }

    /* ── Detail grid ───────────────────────────────────────── */
    .detail-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
    .detail-field label { font-size: 11px; font-weight: 600; color: var(--muted);
                          text-transform: uppercase; letter-spacing: .06em; display: block; margin-bottom: 4px; }
    .detail-field .value { font-size: 15px; }

    /* ── Empty state ───────────────────────────────────────── */
    .empty { padding: 32px; text-align: center; color: var(--muted); }

    /* ── Icon button ───────────────────────────────────────── */
    .btn-icon { background: none; border: none; cursor: pointer; color: var(--muted);
                font-size: 16px; padding: 4px 8px; border-radius: 6px; }
    .btn-icon:hover { background: var(--bg); color: var(--red); }

    /* ── Responsive ────────────────────────────────────────── */
    @media (max-width: 768px) {
      main { padding: 20px 16px; }
      h2 { font-size: 19px; }
      .row { grid-template-columns: 1fr; }
      .stat-val { font-size: 22px; }
      /* Hamburger nav */
      .brand { margin-right: auto; font-size: 14px; }
      .nav-toggle { display: block; }
      .nav-links { display: none;
                   position: absolute; top: 52px; left: 0; right: 0;
                   flex-direction: column; align-items: stretch;
                   background: var(--card); border-bottom: 2px solid var(--border);
                   box-shadow: 0 8px 24px rgba(0,0,0,.12); }
      nav.open .nav-links { display: flex; }
      .nav-links .nav-link { display: block; padding: 15px 24px; font-size: 15px;
                              border-bottom: 1px solid var(--border); margin-bottom: 0;
                              border-left: 3px solid transparent; }
      .nav-links .nav-link.active { border-left-color: var(--blue); font-weight: 600; }
      .nav-links .nav-link:last-child { border-bottom: none; }
      /* Bar chart */
      .bar-label { width: 150px; font-size: 12px; }
      .bar-amount { width: 72px; font-size: 12px; }
      td.merchant { max-width: 160px; }
      /* Filters: stack vertically, but exclude checkboxes from full-width */
      .filters { flex-direction: column; align-items: stretch; }
      .filters label { width: 100%; }
      .filters input:not([type="checkbox"]), .filters select { width: 100%; min-width: 0; }
      .filters button { align-self: flex-start; }
      .detail-grid { grid-template-columns: 1fr 1fr; }
      .flashes { padding: 0 16px; }
    }

    @media (max-width: 480px) {
      .cards { grid-template-columns: 1fr 1fr; }
      .detail-grid { grid-template-columns: 1fr; }
      .bar-label { width: 120px; font-size: 11px; }
      .bar-amount { width: 64px; font-size: 11px; }
      td, th { padding: 8px 10px; font-size: 13px; }
      td.merchant { max-width: 120px; }
    }
  </style>
</head>
<body>
  <nav id="site-nav">
    <a class="brand" href="/">rock money</a>
    <button class="nav-toggle"
            onclick="document.getElementById('site-nav').classList.toggle('open')"
            aria-label="Toggle menu">&#9776;</button>
    <div class="nav-links">
      <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">Dashboard</a>
      <a class="nav-link {% if request.path == '/accounts' %}active{% endif %}" href="/accounts">Accounts</a>
      <a class="nav-link {% if request.path == '/transactions' %}active{% endif %}" href="/transactions">Transactions</a>
      <a class="nav-link {% if request.path == '/reports' %}active{% endif %}" href="/reports">Reports</a>
      <a class="nav-link {% if request.path == '/rules' %}active{% endif %}" href="/rules">Rules</a>
    </div>
  </nav>

  {% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
  <div class="flashes">
    {% for category, message in messages %}
    <div class="flash flash-{{ category }}">{{ message }}</div>
    {% endfor %}
  </div>
  {% endif %}
  {% endwith %}

  <main>
    {% block content %}{% endblock %}
  </main>

  <script>
    // Close nav dropdown when tapping outside
    document.addEventListener('click', function(e) {
      var nav = document.getElementById('site-nav');
      if (nav.classList.contains('open') && !nav.contains(e.target))
        nav.classList.remove('open');
    });
  </script>
</body>
</html>
